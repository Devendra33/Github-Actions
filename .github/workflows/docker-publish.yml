name: DOCKER-CICD

on:
    # push:
    #     branches: [main]

    pull_request:

    workflow_dispatch:


jobs:
    build:
      runs-on: ubuntu-latest
      steps:
        - name: code checkout
          uses: actions/checkout@v4
        
        - name: Docker Build
          run: docker build -t dockercicd_app:${{ github.sha }} .
        
        # It will not run if called by a PR. Only runs when changes are pushed to main branch because of if:github.ref == 'refs/heads/main'
        - name: Login to Docker Hub
          if: github.ref == 'refs/heads/main'
          uses: docker/login-action@v4
          with:
            username: ${{ vars.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_TOKEN }}

        - name: Docker tag & push
          if: github.ref == 'refs/heads/main'
          run: |
            docker tag dockercicd_app:${{ github.sha }} ${{ vars.DOCKER_USERNAME }}/dockercicd_app:${{ github.sha }} 
            docker tag dockercicd_app:${{ github.sha }} ${{ vars.DOCKER_USERNAME }}/dockercicd_app:latest
            docker push ${{ vars.DOCKER_USERNAME }}/dockercicd_app --all-tags

