name: Multi-Jobs

on:
    workflow_dispatch:

    # push:
    #     branches: [main]

    pull_request:
        branches: [main]

# Defining Environment variable at work flow level available in all the jobs
env:
    APP_NAME: myapp

jobs:

    build:
      
      # Defining Environment variable at job level available in all the steps present that job        
      env:    
        ENVIRONMENT: staging

      runs-on: ubuntu-latest
      outputs:
        date: ${{ steps.date.outputs.today }}
        name: ${{ steps.date.outputs.name }}

      steps:
        - name: Build App 
          run: echo "Building the App"
        - name: Environment Variable
        # Run this step if only previous step is failed.
          if: failure()
          # Defining Environment variable at Steps level available in all the steps present that job
          env:
            VERSION: 1.0.0
          run: |
            echo "All Level of Environment variables"
            echo "worflow level variable - $APP_NAME"
            echo "job level variable - $ENVIRONMENT"
            echo "step level variable - $VERSION"

        - name: date today
          id: date
          run: |
           echo "today=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT
           echo "name=Devendra" >> $GITHUB_OUTPUT

    test:
      needs: [build]
      runs-on: ubuntu-latest
      # Runs when previous job is successfull. Possible values failure, cancelled and skipped
      # Example - if we want to run this job if previous job is failed then if:failure().
      if: success()  
      steps:
        - name: Test App
          run: echo "Testing the App"
          # The Next step (Environment Variable) will also run if the current step is failed.env:
          # by default if 1 step task is failed then later steps are skipped. 
          continue-on-error: true

        - name: Environment Variable
          run: |
            echo "All Level of Environment variables"
            echo "worflow level variable - $APP_NAME"
            echo "job level variable - $ENVIRONMENT"
            echo "step level variable - $VERSION" 

    deploy:
      needs: [test]
      runs-on: ubuntu-latest

      # runs this steps when branch is main
      if: github.ref == 'refs/heads/main'
      steps:
        - name: Deploy App
          run: echo "Deploying the App"
        - name: Environment Variable
          run: |
            echo "All Level of Environment variables"
            echo "worflow level variable - $APP_NAME"
            echo "job level variable - $ENVIRONMENT"
            echo "step level variable - $VERSION"

    output:
        runs-on: ubuntu-latest
        # runs this steps when branch is main
        if: github.ref == 'refs/heads/main'
        needs: [build, deploy]
        steps:
          - name: Date and name
            run: echo "Hi ${{ needs.build.outputs.name }} today date is ${{ needs.build.outputs.date }}" 