name: Secret-Read

on:
    workflow_dispatch:

jobs:
    read_secret:
        runs-on: ubuntu-latest
        steps:
          - name: check Secret set
            env:
               mysecret: ${{ secrets.MY_SECRET_MESSAGE }}"
            run: |
              if [[ -n $mysecret ]]; then
                echo "The secret is set - true"
              else
                echo "The secret is set - true"
              fi