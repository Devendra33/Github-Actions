name: Reusable Build

on:
    workflow_call:
        inputs:
          app_name:
            required: true
            type: string
          environment:
            required: true
            type: string
            default: staging
        secrets:
          docker_token:
            required: true

jobs:
    Build:
      runs-on: ubuntu-latest
      steps: 
        - name: checkout code
          uses: actions/checkout@v6

        - name: Build App
          run: echo "Building ${{ inputs.app_name }} for ${{ inputs.environment }}" 

    Secret_check:
      runs-on: ubuntu-latest
      steps:
        - name: Check Secret
          run: |
            if [[ -n ${{ secrets.docker_token }} ]]; then
              echo "Secret is present"
            else
              echo "Secret is NOT present"
            fi  