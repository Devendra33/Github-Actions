# Name of the github actions pipeline
name: Hello

# Trigger Condition - when changes detects in main .md files (this is continous deployment)
on:
  push:
    branches: [main]
    paths:
      - "**.md"

# Job Defination
jobs:

# greet is the first job
  greet:
    runs-on: ubuntu-latest   # Runner provided by github
    steps:    # Steps defination
      - name: Say hello
        run: echo "Hello Devendra from Github Actions Task"

      - name: Machine User
        run: echo "Machine User - $USER"

# show-verison is the Second job
  show-version:
    runs-on: ubuntu-latest
    steps:
      - name: Docker and Python
        run: docker --version && python --version
